name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install JavaScript test dependencies
        run: npm ci
      - name: Run frozen Python suite
        run: python -m pytest -q
      - name: Run JS parity, trace, UI, build, and Worker/D1 tests
        run: npm run test:all
      - name: Validate Worker bundle
        run: npm run check:worker
      - name: Rebuild both static targets
        run: npm run build
      - name: Validate deploy configuration
        run: npm run check:config
