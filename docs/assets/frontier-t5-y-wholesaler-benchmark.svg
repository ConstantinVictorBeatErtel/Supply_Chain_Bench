<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Frontier Tier-5 Y wholesaler benchmark</title>
  <desc id="desc">Kimi K3 scores 24.176 between the naive baseline at 10 and the adaptive base-stock oracle at 100 on 100 frozen Tier-5 Y-topology seeds.</desc>
  <rect width="1200" height="620" fill="#faf9f6"/>
  <rect x="56" y="46" width="1088" height="528" rx="8" fill="#fff" stroke="#e5e2db"/>
  <text x="96" y="113" fill="#20201e" font-family="Georgia, serif" font-size="40">Frontier wholesaler benchmark</text>
  <text x="96" y="151" fill="#6a6964" font-family="Arial, sans-serif" font-size="18">Tier 5 Y topology · 36 weeks · 100 frozen seeds · score out of 100</text>
  <line x1="96" y1="188" x2="1104" y2="188" stroke="#e5e2db"/>
  <text x="109" y="225" fill="#898780" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">REFERENCE</text>
  <text x="214" y="225" fill="#898780" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">POLICY</text>
  <text x="970" y="225" fill="#898780" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">SCORE</text>
  <g font-family="Arial, sans-serif">
    <text x="112" y="298" fill="#242320" font-size="22" font-weight="700">—</text>
    <text x="214" y="284" fill="#242320" font-size="21" font-weight="700">Adaptive base-stock oracle</text>
    <text x="214" y="310" fill="#77756f" font-size="15">reference upper bound</text>
    <rect x="540" y="270" width="385" height="26" rx="5" fill="#eeeDE9"/>
    <rect x="540" y="270" width="385" height="26" rx="5" fill="#2d8f83"/>
    <text x="970" y="292" fill="#242320" font-size="24" font-weight="700">100.000</text>
    <line x1="96" y1="337" x2="1104" y2="337" stroke="#eceae5"/>
    <text x="112" y="390" fill="#242320" font-size="22" font-weight="700">1</text>
    <text x="214" y="376" fill="#242320" font-size="21" font-weight="700">Kimi K3</text>
    <text x="214" y="402" fill="#77756f" font-size="15">moonshotai/kimi-k3 · zero-shot</text>
    <rect x="540" y="362" width="385" height="26" rx="5" fill="#eeeDE9"/>
    <rect x="540" y="362" width="93" height="26" rx="5" fill="#873cff"/>
    <text x="970" y="384" fill="#242320" font-size="24" font-weight="700">24.176</text>
    <line x1="96" y1="429" x2="1104" y2="429" stroke="#eceae5"/>
    <text x="112" y="482" fill="#242320" font-size="22">—</text>
    <text x="214" y="468" fill="#242320" font-size="21" font-weight="700">Naive incoming-order policy</text>
    <text x="214" y="494" fill="#77756f" font-size="15">reference lower bound</text>
    <rect x="540" y="454" width="385" height="26" rx="5" fill="#eeeDE9"/>
    <rect x="540" y="454" width="39" height="26" rx="5" fill="#8b8881"/>
    <text x="970" y="476" fill="#242320" font-size="24" font-weight="700">10.000</text>
  </g>
  <text x="96" y="539" fill="#6a6964" font-family="Arial, sans-serif" font-size="15">Score = clamp(10 + 90 × (naive cost − model cost) ÷ (naive cost − oracle cost), 0, 100)</text>
</svg>
