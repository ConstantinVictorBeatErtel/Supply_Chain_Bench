<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Live-Y domain-randomized wholesaler benchmark</title>
  <desc id="desc">On the fixed 16-seed live-Y research evaluation with research prompts, GPT-5.6 Luna scores 45.70, Qwen3.5-4B GRPO LoRA 42.24, untuned Qwen 37.26, DeepSeek V4 Flash 33.06, and Laguna S 2.1 16.68 as a percentage of hindsight-perfect local cost.</desc>
  <rect width="1200" height="780" fill="#f7f5ef"/>
  <rect x="48" y="44" width="1104" height="692" fill="none" stroke="#111417" stroke-width="2"/>
  <rect x="48" y="44" width="9" height="692" fill="#f05c3d"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111417">
    <text x="92" y="94" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.1">BDG / LIVE-Y RESEARCH / 2026.08</text>
    <text x="92" y="152" font-family="Georgia, serif" font-size="46">Who closes the hindsight gap?</text>
    <text x="92" y="188" fill="#596260" font-size="17">Tier-5 Y wholesaler · 36 weeks · 16 fixed research seeds · research prompt</text>
  </g>
  <line x1="92" y1="220" x2="1108" y2="220" stroke="#111417" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4" fill="#596260">
    <text x="92" y="252">RANK</text>
    <text x="185" y="252">POLICY</text>
    <text x="674" y="252">0</text>
    <text x="820" y="252">PERFECT</text>
    <text x="1048" y="252">100</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="312" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="17">01</text>
    <text x="185" y="302" fill="#111417" font-size="22" font-weight="700">GPT-5.6 Luna</text>
    <text x="185" y="326" fill="#596260" font-size="14">openai/gpt-5.6-luna · zero-shot · 16/16 clean</text>
    <rect x="674" y="285" width="370" height="24" fill="#dfdfd7"/>
    <rect x="674" y="285" width="169" height="24" fill="#2d8f83"/>
    <text x="1060" y="306" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">45.70</text>
