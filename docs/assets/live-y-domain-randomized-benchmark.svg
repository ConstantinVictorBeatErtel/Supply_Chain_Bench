  <text x="92" y="748" fill="#596260" font-family="Arial, Helvetica, sans-serif" font-size="14">Score = 100 × hindsight-perfect mean local cost ÷ policy mean local cost. Perfect mean = 720.88; adaptive base-stock = 783.59 (~1.09× perfect).</text>
