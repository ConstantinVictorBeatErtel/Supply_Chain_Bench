    <text x="185" y="398" fill="#111417" font-size="22" font-weight="700">Qwen3.5-4B + GRPO LoRA</text>
    <text x="185" y="422" fill="#596260" font-size="14">teacher-free adapter · research prompt · 16/16 clean</text>
    <rect x="674" y="381" width="370" height="24" fill="#dfdfd7"/>
    <rect x="674" y="381" width="156" height="24" fill="#111417"/>
    <text x="1060" y="402" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">42.24</text>
    <line x1="92" y1="446" x2="1108" y2="446" stroke="#c8c8c1"/>

    <text x="96" y="504" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="17">03</text>
    <text x="185" y="494" fill="#111417" font-size="22" font-weight="700">Qwen3.5-4B</text>
    <text x="185" y="518" fill="#596260" font-size="14">untuned base · research prompt · 16/16 clean</text>
    <rect x="674" y="477" width="370" height="24" fill="#dfdfd7"/>
    <rect x="674" y="477" width="138" height="24" fill="#9ba3a0"/>
    <text x="1060" y="498" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="22" font-weight="700">37.26</text>
    <line x1="92" y1="542" x2="1108" y2="542" stroke="#c8c8c1"/>

