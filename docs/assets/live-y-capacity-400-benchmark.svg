<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Live-Y wholesaler leaderboard (capacity 400)</title>
  <desc id="desc">Laguna S 2.1 14.02, DeepSeek V4 Flash 7.12, Nemotron 3 Ultra 6.56 as percent of hindsight-perfect local cost on 16 fixed live-Y seeds under factory capacity 400.</desc>

  <rect width="1200" height="620" fill="#F7F5F1"/>
  <rect x="64" y="40" width="1072" height="540" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1.5"/>

  <text x="104" y="92" fill="#7A3B45" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="12" letter-spacing="2.4">LIVE-Y RESEARCH  |  CAPACITY 400  |  16 SEEDS</text>
  <text x="104" y="140" fill="#3A2F2C" font-family="Georgia, 'Times New Roman', serif" font-size="38">Feasible-supply board</text>
  <text x="104" y="172" fill="#7A6E68" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">Wholesaler local cost as a share of hindsight-perfect play</text>

  <line x1="104" y1="198" x2="1096" y2="198" stroke="#E5DFD7" stroke-width="1"/>

  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#A39891" letter-spacing="1.2">
    <text x="104" y="230">MODEL</text>
    <text x="700" y="230">0</text>
    <text x="878" y="230">PERFECT</text>
    <text x="1070" y="230">100</text>
  </g>

  <g stroke="#E5DFD7" stroke-width="1">
    <line x1="700" y1="242" x2="700" y2="480"/>
    <line x1="885" y1="242" x2="885" y2="480" stroke="#C4A4A8"/>
    <line x1="1070" y1="242" x2="1070" y2="480"/>
  </g>

  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="104" y="292" fill="#3A2F2C" font-size="22">Laguna S 2.1</text>
    <text x="104" y="316" fill="#7A6E68" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="12">free tier  |  7/16 clean</text>
    <rect x="700" y="282" width="370" height="18" fill="#EFEAE3"/>
    <rect x="700" y="282" width="52" height="18" fill="#7A3B45"/>
    <text x="1084" y="297" fill="#3A2F2C" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="18" text-anchor="end">14.02</text>

    <text x="104" y="372" fill="#3A2F2C" font-size="22">DeepSeek V4 Flash</text>
    <text x="104" y="396" fill="#7A6E68" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="12">zero-shot  |  16/16 clean</text>
    <rect x="700" y="362" width="370" height="18" fill="#EFEAE3"/>
    <rect x="700" y="362" width="26" height="18" fill="#7A3B45" fill-opacity="0.78"/>
    <text x="1084" y="377" fill="#3A2F2C" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="18" text-anchor="end">7.12</text>

    <text x="104" y="452" fill="#3A2F2C" font-size="22">Nemotron 3 Ultra</text>
    <text x="104" y="476" fill="#7A6E68" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="12">free tier  |  2/16 clean</text>
    <rect x="700" y="442" width="370" height="18" fill="#EFEAE3"/>
    <rect x="700" y="442" width="24" height="18" fill="#7A3B45" fill-opacity="0.56"/>
    <text x="1084" y="457" fill="#3A2F2C" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="18" text-anchor="end">6.56</text>
  </g>

  <line x1="104" y1="510" x2="1096" y2="510" stroke="#E5DFD7" stroke-width="1"/>
  <text x="104" y="542" fill="#7A6E68" font-family="Georgia, 'Times New Roman', serif" font-size="14">Score = 100 × hindsight-perfect mean / policy mean. Perfect = 287.22; adaptive = 388.84 (~1.35×). Hub Tier-5 remains capacity 22.</text>
</svg>
