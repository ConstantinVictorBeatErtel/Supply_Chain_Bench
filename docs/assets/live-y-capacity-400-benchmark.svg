<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title">
  <title id="title">Live-Y capacity-400 scores</title>
  <rect width="1120" height="520" fill="#F7F5F1"/>
  <rect x="40" y="24" width="1040" height="472" rx="8" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1.5"/>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A3B45"/>
      <stop offset="100%" stop-color="#C9844A"/>
    </linearGradient>
  </defs>

  <!-- names left; track x=320..1048 (728px) => 7.28 px per score point; scale 0-100 -->
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#3A2F2C" text-anchor="end">
    <text x="304" y="105">Grok 4.5</text>
    <text x="304" y="161">GPT-5.6 Luna</text>
    <text x="304" y="217">Laguna S 2.1</text>
    <text x="304" y="273">Qwen3.5-4B GRPO</text>
    <text x="304" y="329">DeepSeek V4 Flash</text>
    <text x="304" y="385">Qwen3.5-4B</text>
    <text x="304" y="441">Nemotron 3 Ultra</text>
  </g>

  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" fill="#3A2F2C">
    <!-- Grok 29.78 -->
    <rect x="320" y="80" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="80" width="217" height="36" rx="4" fill="url(#bar)"/>
    <text x="549" y="105">29.78</text>
    <!-- Luna 14.80 -->
    <rect x="320" y="136" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="136" width="108" height="36" rx="4" fill="url(#bar)" fill-opacity="0.95"/>
    <text x="440" y="161">14.80</text>
    <!-- Laguna 14.02 -->
    <rect x="320" y="192" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="192" width="102" height="36" rx="4" fill="url(#bar)" fill-opacity="0.90"/>
    <text x="434" y="217">14.02</text>
    <!-- Qwen GRPO 7.48 -->
    <rect x="320" y="248" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="248" width="54" height="36" rx="4" fill="url(#bar)" fill-opacity="0.85"/>
    <text x="386" y="273">7.48</text>
    <!-- DeepSeek 7.12 -->
    <rect x="320" y="304" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="304" width="52" height="36" rx="4" fill="url(#bar)" fill-opacity="0.80"/>
    <text x="384" y="329">7.12</text>
    <!-- Qwen untrained 6.73 -->
    <rect x="320" y="360" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="360" width="49" height="36" rx="4" fill="url(#bar)" fill-opacity="0.75"/>
    <text x="381" y="385">6.73</text>
    <!-- Nemotron 6.56 -->
    <rect x="320" y="416" width="728" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="320" y="416" width="48" height="36" rx="4" fill="url(#bar)" fill-opacity="0.70"/>
    <text x="380" y="441">6.56</text>
  </g>
</svg>
