<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title">
  <title id="title">Live-Y capacity-400 scores</title>
  <rect width="1120" height="520" fill="#F7F5F1"/>
  <rect x="40" y="24" width="1040" height="472" rx="8" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1.5"/>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A3B45"/>
      <stop offset="100%" stop-color="#C9844A"/>
    </linearGradient>
  </defs>

  <!-- track x=72..1000 (928px) => 9.28 px per score point; names on-track with cream chips -->
  <g font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#3A2F2C">
    <!-- Grok 29.78 -->
    <rect x="72" y="80" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="80" width="276" height="36" rx="4" fill="url(#bar)"/>
    <rect x="80" y="86" width="118" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="104">Grok 4.5</text>
    <text x="360" y="105" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">29.78</text>
    <!-- Luna 14.80 -->
    <rect x="72" y="136" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="136" width="137" height="36" rx="4" fill="url(#bar)" fill-opacity="0.95"/>
    <rect x="80" y="142" width="148" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="160">GPT-5.6 Luna</text>
    <text x="246" y="161" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">14.80</text>
    <!-- Laguna 14.02 -->
    <rect x="72" y="192" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="192" width="130" height="36" rx="4" fill="url(#bar)" fill-opacity="0.90"/>
    <rect x="80" y="198" width="138" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="216">Laguna S 2.1</text>
    <text x="236" y="217" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">14.02</text>
    <!-- Qwen GRPO 7.48 -->
    <rect x="72" y="248" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="248" width="69" height="36" rx="4" fill="url(#bar)" fill-opacity="0.85"/>
    <rect x="80" y="254" width="178" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="272">Qwen3.5-4B GRPO</text>
    <text x="276" y="273" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">7.48</text>
    <!-- DeepSeek 7.12 -->
    <rect x="72" y="304" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="304" width="66" height="36" rx="4" fill="url(#bar)" fill-opacity="0.80"/>
    <rect x="80" y="310" width="188" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="328">DeepSeek V4 Flash</text>
    <text x="286" y="329" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">7.12</text>
    <!-- Qwen untrained 6.73 -->
    <rect x="72" y="360" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="360" width="62" height="36" rx="4" fill="url(#bar)" fill-opacity="0.75"/>
    <rect x="80" y="366" width="128" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="384">Qwen3.5-4B</text>
    <text x="226" y="385" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">6.73</text>
    <!-- Nemotron 6.56 -->
    <rect x="72" y="416" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="416" width="61" height="36" rx="4" fill="url(#bar)" fill-opacity="0.70"/>
    <rect x="80" y="422" width="178" height="24" rx="4" fill="#F7F5F1" fill-opacity="0.92"/>
    <text x="88" y="440">Nemotron 3 Ultra</text>
    <text x="276" y="441" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" font-weight="400">6.56</text>
  </g>
</svg>
