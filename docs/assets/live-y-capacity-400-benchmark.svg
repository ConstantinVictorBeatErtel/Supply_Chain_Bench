<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title">
  <title id="title">Live-Y capacity-400 scores</title>
  <rect width="1120" height="520" fill="#F7F5F1"/>
  <rect x="40" y="24" width="1040" height="472" rx="8" fill="#FFFFFF" stroke="#E5DFD7" stroke-width="1.5"/>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7A3B45"/>
      <stop offset="100%" stop-color="#C9844A"/>
    </linearGradient>
  </defs>

  <!-- track x=72..1000 (928px) => 9.28 px per score point; scale 0-100 -->
  <g stroke="#EFEAE3" stroke-width="1">
    <line x1="72" y1="60" x2="72" y2="476"/>
    <line x1="304" y1="60" x2="304" y2="476"/>
    <line x1="536" y1="60" x2="536" y2="476"/>
    <line x1="768" y1="60" x2="768" y2="476"/>
    <line x1="1000" y1="60" x2="1000" y2="476"/>
  </g>

  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="20" fill="#3A2F2C">
    <!-- Grok 29.78 -->
    <rect x="72" y="80" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="80" width="276" height="36" rx="4" fill="url(#bar)"/>
    <text x="360" y="105">29.78</text>
    <!-- Luna 14.80 -->
    <rect x="72" y="136" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="136" width="137" height="36" rx="4" fill="url(#bar)" fill-opacity="0.95"/>
    <text x="221" y="161">14.80</text>
    <!-- Laguna 14.02 -->
    <rect x="72" y="192" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="192" width="130" height="36" rx="4" fill="url(#bar)" fill-opacity="0.90"/>
    <text x="214" y="217">14.02</text>
    <!-- Qwen GRPO 7.48 -->
    <rect x="72" y="248" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="248" width="69" height="36" rx="4" fill="url(#bar)" fill-opacity="0.85"/>
    <text x="153" y="273">7.48</text>
    <!-- DeepSeek 7.12 -->
    <rect x="72" y="304" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="304" width="66" height="36" rx="4" fill="url(#bar)" fill-opacity="0.80"/>
    <text x="150" y="329">7.12</text>
    <!-- Qwen untrained 6.73 -->
    <rect x="72" y="360" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="360" width="62" height="36" rx="4" fill="url(#bar)" fill-opacity="0.75"/>
    <text x="146" y="385">6.73</text>
    <!-- Nemotron 6.56 -->
    <rect x="72" y="416" width="928" height="36" rx="4" fill="#EFEAE3"/>
    <rect x="72" y="416" width="61" height="36" rx="4" fill="url(#bar)" fill-opacity="0.70"/>
    <text x="145" y="441">6.56</text>
  </g>
</svg>
