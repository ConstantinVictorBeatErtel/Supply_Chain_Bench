<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Beer Distribution Game wholesaler benchmark</title>
  <desc id="desc">Minimal operational leaderboard on 100 frozen seeds. Qwen3.5-4B LoRA scores 51.47, Claude Opus 5 scores 49.66, and untuned Qwen3.5-4B scores 7.80.</desc>
  <rect width="1200" height="640" fill="#f4f5f2"/>
  <g stroke="#d8dcd6" stroke-width="1">
    <path d="M56 55H1144M56 125H1144M56 195H1144M56 265H1144M56 335H1144M56 405H1144M56 475H1144M56 545H1144"/>
    <path d="M56 55V575M164 55V575M272 55V575M380 55V575M488 55V575M596 55V575M704 55V575M812 55V575M920 55V575M1028 55V575M1136 55V575"/>
  </g>
  <rect x="56" y="55" width="1088" height="520" fill="#f8f9f7" fill-opacity=".78" stroke="#151a1f" stroke-width="2"/>
  <rect x="56" y="55" width="10" height="520" fill="#e34f2a"/>
  <text x="96" y="111" fill="#151a1f" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="2.8">BDG / CONTROL BENCHMARK / V0.2.0</text>
  <text x="96" y="163" fill="#151a1f" font-family="Georgia, serif" font-size="46">Wholesaler control</text>
  <text x="96" y="197" fill="#4c545b" font-family="Arial, Helvetica, sans-serif" font-size="17">100 frozen demand sequences · 20 weeks · score out of 100</text>
  <line x1="96" y1="231" x2="1104" y2="231" stroke="#151a1f" stroke-width="2"/>
  <g fill="#4c545b" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">
    <text x="96" y="259">MODEL</text><text x="696" y="259">0</text><text x="886" y="259">50</text><text x="1071" y="259">100</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="316" fill="#151a1f" font-size="22" font-weight="700">Qwen3.5-4B + LoRA</text>
    <text x="96" y="340" fill="#4c545b" font-size="14">bf16 · rank 16</text>
    <rect x="696" y="302" width="380" height="22" fill="#dce1dd"/>
    <rect x="696" y="302" width="196" height="22" fill="#151a1f"/>
    <rect x="887" y="296" width="2" height="34" fill="#e34f2a"/>
    <text x="1095" y="320" fill="#151a1f" font-size="24" font-weight="700">51.47</text>
    <line x1="96" y1="366" x2="1104" y2="366" stroke="#cbd1cb"/>
    <text x="96" y="421" fill="#151a1f" font-size="22" font-weight="700">Claude Opus 5</text>
    <text x="96" y="445" fill="#4c545b" font-size="14">zero-shot · compact JSON policy</text>
    <rect x="696" y="407" width="380" height="22" fill="#dce1dd"/>
    <rect x="696" y="407" width="189" height="22" fill="#4b7b8d"/>
    <rect x="887" y="401" width="2" height="34" fill="#e34f2a"/>
    <text x="1095" y="425" fill="#151a1f" font-size="24" font-weight="700">49.66</text>
    <line x1="96" y1="471" x2="1104" y2="471" stroke="#cbd1cb"/>
    <text x="96" y="526" fill="#151a1f" font-size="22" font-weight="700">Qwen3.5-4B</text>
    <text x="96" y="550" fill="#4c545b" font-size="14">untuned</text>
    <rect x="696" y="512" width="380" height="22" fill="#dce1dd"/>
    <rect x="696" y="512" width="30" height="22" fill="#a8b0ad"/>
    <text x="1095" y="530" fill="#151a1f" font-size="24" font-weight="700">7.80</text>
  </g>
  <text x="96" y="607" fill="#4c545b" font-family="Arial, Helvetica, sans-serif" font-size="14">Score = 100 × naive mean cost ÷ (naive mean cost + policy mean cost). Naive marks 50.</text>
</svg>
