<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Beer Distribution Game model benchmark</title>
  <desc id="desc">The Qwen3.5-4B LoRA model scores 51.47, Claude Opus 5 scores 49.66, and untuned Qwen3.5-4B scores 7.80 on the 100 frozen-seed wholesaler benchmark.</desc>
  <rect width="1200" height="650" fill="#f7f5ef"/>
  <rect x="48" y="44" width="1104" height="562" fill="none" stroke="#111417" stroke-width="2"/>
  <rect x="48" y="44" width="9" height="562" fill="#f05c3d"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111417">
    <text x="92" y="94" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="700" letter-spacing="2.1">BDG / CONTROL LAB / 2026.08</text>
    <text x="92" y="159" font-family="Georgia, serif" font-size="53">Who controls the delay?</text>
    <text x="92" y="195" fill="#596260" font-size="18">Serial wholesaler · 100 frozen demand sequences · 20 weeks</text>
  </g>
  <line x1="92" y1="235" x2="1108" y2="235" stroke="#111417" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.4" fill="#596260">
    <text x="92" y="267">RANK</text>
    <text x="185" y="267">POLICY</text>
    <text x="674" y="267">0</text>
    <text x="874" y="267">50 / NAIVE</text>
    <text x="1055" y="267">100</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="96" y="333" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="17">01</text>
    <text x="185" y="323" fill="#111417" font-size="23" font-weight="700">Qwen3.5-4B + LoRA</text>
    <text x="185" y="347" fill="#596260" font-size="14">bf16 · rank 16 · teacher-free adapter</text>
    <rect x="674" y="306" width="370" height="24" fill="#dfdfd7"/>
    <rect x="674" y="306" width="190" height="24" fill="#111417"/>
    <rect x="858" y="298" width="2" height="40" fill="#f05c3d"/>
    <text x="1064" y="327" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700">51.47</text>
    <line x1="92" y1="374" x2="1108" y2="374" stroke="#c8c8c1"/>
    <text x="96" y="439" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="17">02</text>
    <text x="185" y="429" fill="#111417" font-size="23" font-weight="700">Claude Opus 5</text>
    <text x="185" y="453" fill="#596260" font-size="14">zero-shot · compact JSON policy</text>
    <rect x="674" y="412" width="370" height="24" fill="#dfdfd7"/>
    <rect x="674" y="412" width="184" height="24" fill="#537f98"/>
    <rect x="858" y="404" width="2" height="40" fill="#f05c3d"/>
    <text x="1064" y="433" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700">49.66</text>
    <line x1="92" y1="480" x2="1108" y2="480" stroke="#c8c8c1"/>
    <text x="96" y="545" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="17">03</text>
    <text x="185" y="535" fill="#111417" font-size="23" font-weight="700">Qwen3.5-4B</text>
    <text x="185" y="559" fill="#596260" font-size="14">untuned</text>
    <rect x="674" y="518" width="370" height="24" fill="#dfdfd7"/>
    <rect x="674" y="518" width="29" height="24" fill="#9ba3a0"/>
    <text x="1064" y="539" fill="#111417" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700">7.80</text>
  </g>
  <text x="92" y="588" fill="#596260" font-family="Arial, Helvetica, sans-serif" font-size="14">Score = 100 × naive mean cost ÷ (naive mean cost + policy mean cost). Higher is better.</text>
</svg>
