[project]
name = "beer-distribution-game"
version = "0.2.2"
description = "Verifiers Beer Distribution Game: seeded Y-network supply-chain control with tool-calling agents. Frozen Tier-5 factory capacity 22 (Hub leaderboard); public/live-Y research uses capacity 400 separately."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Consti Ertel" }]
tags = ["llm-agents", "supply-chain", "control", "reinforcement-learning", "beer-game"]
dependencies = ["verifiers==0.2.0"]

[project.optional-dependencies]
human = [
    "gradio>=4.44.0",
    "huggingface_hub>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beer_distribution_game"]

[tool.verifiers.eval]
num_tasks = 5
num_rollouts = 1
max_concurrent = 5
