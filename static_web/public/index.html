<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A deterministic supply-chain control environment for people and AI agents.">
    <meta name="theme-color" content="#0b0a09">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'">
    <title>Beer Distribution Game</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./config.js" defer></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to game</a>
    <header class="site-header">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true">BDG</span>
        <div>
          <p class="brand-name">Beer Distribution Game</p>
        </div>
      </div>
      <div id="header-status" class="header-status"><span><b>SEAT</b>Wholesaler</span><span><b>WEEK</b>—</span><span><b>COST</b>—</span></div>
    </header>

    <main id="main" class="shell" tabindex="-1">
      <div id="app" aria-live="polite">
        <section class="loading-card">
          <p class="section-label">Preparing deterministic scenario</p>
          <h1>Loading game…</h1>
        </section>
      </div>
    </main>

    <footer class="site-footer"></footer>
  </body>
</html>
